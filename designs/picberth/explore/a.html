<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>PicBerth</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="shared.css" />
<style>
/* Direction A: the current shell, refined. */
.app { background: var(--bg); }
.side { width: var(--side); flex: none; display: flex; flex-direction: column; padding: 12px 8px; gap: 2px; }
.brand { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; font-weight: var(--w-strong); }
.brand .mark { width: 16px; height: 16px; border-radius: var(--r-xs); background: var(--accent); }
.search-trigger { display: flex; align-items: center; gap: 8px; height: 32px; margin: 8px 0 12px; padding: 0 8px 0 12px; border-radius: var(--r-s); color: var(--faint); box-shadow: inset 0 0 0 var(--bw) var(--line); }
.search-trigger:hover { box-shadow: inset 0 0 0 var(--bw) var(--line-hover); color: var(--muted); }
.search-trigger kbd { margin-left: auto; }
.nav { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--r-s); color: var(--muted); width: 100%; text-align: left; }
.nav:hover { background: var(--hover); color: var(--text); }
.nav[aria-current='page'] { background: var(--sel); color: var(--text); }
.nav .n { margin-left: auto; font-size: var(--fs-s); color: var(--muted); }
.nav .tw { width: 16px; display: grid; place-items: center; margin-left: -4px; color: var(--faint); }
.nav.sub1 { padding-left: 24px; } .nav.sub2 { padding-left: 40px; } .nav.sub3 { padding-left: 56px; }
.side .gap { flex: 1; }
.side .nav { position: relative; }
@media (max-width: 1099px) { .side .nav .dot { position: absolute; top: 6px; right: 6px; margin: 0 !important; } }
.side hr { border: 0; border-top: var(--bw) solid var(--hairline); margin: 8px 12px; }
.avatar { width: 20px; height: 20px; border-radius: 999px; background: var(--fill); display: grid; place-items: center; font-size: var(--fs-s); font-weight: var(--w-strong); color: var(--text); margin-left: -2px; }

.panel { flex: 1; min-width: 0; margin: 8px 8px 8px 0; border-radius: var(--r-l); background: var(--panel); box-shadow: 0 0 0 var(--bw) var(--hairline); display: flex; overflow: hidden; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.head { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 var(--gutter); border-bottom: var(--bw) solid var(--hairline); }
.crumbs { display: flex; align-items: center; gap: 4px; font-size: var(--fs-l); font-weight: var(--w-strong); min-width: 0; letter-spacing: -0.012em; }
.crumbs .up { color: var(--muted); font-weight: var(--w-medium); }
.crumbs .sepi { color: var(--faint); }
.crumbs .count { font-size: var(--fs-m); color: var(--muted); font-weight: var(--w-regular); margin-left: 4px; }
.head .search { width: 220px; }
.content { flex: 1; overflow: auto; padding: 16px var(--gutter) 32px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.fchip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px; border-radius: var(--r-s); box-shadow: inset 0 0 0 var(--bw) var(--line); }
.fchip:hover { background: var(--hover); box-shadow: inset 0 0 0 var(--bw) var(--line-hover); }
.fchip .icon { color: var(--muted); }
.fchip .n { color: var(--muted); font-size: var(--fs-s); }

.jrow { display: flex; gap: 12px; margin-bottom: 16px; }
.tile { flex: none; display: grid; gap: 6px; text-align: left; position: relative; }
.tile .tile-img { outline-offset: 2px; }
.tile[aria-selected='true'] .tile-img { outline: 2px solid var(--text); }
.tile .name { line-height: var(--lh-m); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .over { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 6px; opacity: 0; }
.tile:hover .over, .tile:focus-within .over, .tile[aria-selected='true'] .over { opacity: 1; }
.over .chk, .over .cp { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--r-s); background: var(--blackA-6); color: var(--whiteA-12); }
.over .cp:hover, .over .chk:hover { background: var(--blackA-9); }
.over .chk .box { width: 14px; height: 14px; border-radius: var(--r-xs); box-shadow: inset 0 0 0 1px var(--whiteA-9); }
.tile .badge-gif { position: absolute; left: 6px; bottom: 6px; height: 18px; padding: 0 6px; border-radius: var(--r-xs); background: var(--blackA-6); color: var(--whiteA-12); font-size: var(--fs-s); line-height: 18px; font-weight: var(--w-medium); }

.tray { margin-bottom: 16px; border-radius: var(--r-m); box-shadow: inset 0 0 0 var(--bw) var(--hairline); }
.tray-head { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 4px 0 12px; border-bottom: var(--bw) solid var(--hairline); }
.tray-row { display: grid; grid-template-columns: 32px 1fr 160px auto; align-items: center; gap: 12px; min-height: 44px; padding: 0 4px 0 12px; }
.tray-row + .tray-row { border-top: var(--bw) solid var(--hairline); }
.tray-row img { width: 32px; height: 32px; border-radius: var(--r-xs); object-fit: cover; }
.tray-row .st { color: var(--muted); font-size: var(--fs-s); text-align: right; }

.detail { width: var(--detail); flex: none; border-left: var(--bw) solid var(--hairline); display: flex; flex-direction: column; animation: slidein var(--dur) var(--ease); }
@keyframes slidein { from { transform: translateX(16px); opacity: 0; } }
.d-top { height: 48px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: var(--bw) solid var(--hairline); }
.d-body { flex: 1; overflow: auto; padding: 16px var(--gutter); display: grid; gap: 16px; align-content: start; }
.d-prev { aspect-ratio: 4 / 3; border-radius: var(--r-m); overflow: hidden; background: var(--fill); }
.d-prev img { width: 100%; height: 100%; object-fit: contain; }
.d-title { font-size: var(--fs-l); line-height: var(--lh-l); font-weight: var(--w-strong); word-break: break-all; }
.meta { display: flex; gap: 12px; color: var(--muted); }
.d-foot { flex: none; display: flex; justify-content: space-between; padding: 12px; border-top: var(--bw) solid var(--hairline); }

/* System page */
.sys { max-width: 760px; margin: 0 auto; display: grid; gap: 32px; }
.sec-title { font-size: var(--fs-l); line-height: var(--lh-l); font-weight: var(--w-strong); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.sec-title .btn { font-size: var(--fs-m); font-weight: var(--w-medium); letter-spacing: normal; }
.health { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: var(--r-m); box-shadow: inset 0 0 0 var(--bw) var(--hairline); }
.figs { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 12px; border-radius: var(--r-m); box-shadow: inset 0 0 0 var(--bw) var(--hairline); }
.fig { padding: 12px 16px; display: grid; gap: 2px; }
.fig + .fig { border-left: var(--bw) solid var(--hairline); }
.fig b { font-size: var(--fs-l); line-height: var(--lh-l); font-weight: var(--w-strong); font-variant-numeric: tabular-nums; }
.fig span { color: var(--muted); font-size: var(--fs-s); }
.disk { margin-top: 12px; display: grid; gap: 8px; }
.disk .bar { height: 6px; border-radius: 999px; background: var(--fill); display: flex; overflow: hidden; }
.disk .bar i { background: var(--text); min-width: 3px; }
.disk .bar i + i { background: var(--faint); }
.disk .legend { display: flex; gap: 16px; color: var(--muted); font-size: var(--fs-s); flex-wrap: wrap; }
.disk .legend b { color: var(--text); font-weight: var(--w-medium); margin-left: 4px; }
.rows > div { display: flex; align-items: center; gap: 12px; min-height: 44px; border-top: var(--bw) solid var(--hairline); }
.rows > div:last-child { border-bottom: var(--bw) solid var(--hairline); }
.rows .k { width: 140px; flex: none; font-weight: var(--w-medium); }
.rows .muted { flex: 1; }
.tok-name { display: grid; flex: 1; min-width: 0; }
.unit { width: 120px; }
.subnav { display: flex; gap: 4px; }

.tabbar, .m-only { display: none; }

/* Tablet: icon rail */
@media (max-width: 1099px) {
  .side { width: var(--rail); padding: 12px 8px; align-items: center; }
  .side .label, .side .n, .search-trigger, .nav.sub1, .nav.sub2, .nav.sub3, .side hr, .nav .tw { display: none; }
  .nav { width: 40px; justify-content: center; padding: 0; }
  .brand { padding: 0; justify-content: center; }
  .detail { position: fixed; right: 8px; top: 8px; bottom: 8px; border-radius: var(--r-l); background: var(--elev); box-shadow: 0 0 0 var(--bw) var(--hairline), var(--shadow); z-index: 40; }
}
/* Phone */
@media (max-width: 720px) {
  :root { --gutter: 16px; }
  .side { display: none; }
  .panel { margin: 0; border-radius: 0; box-shadow: none; }
  .head .search, .d-only { display: none !important; }
  .m-only { display: inline-flex; }
  .content { padding-bottom: 96px; }
  .jrow { gap: 8px; margin-bottom: 12px; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--panel); border-top: var(--bw) solid var(--hairline); z-index: 30; }
  .tabbar button { flex: 1; display: grid; place-items: center; align-content: center; gap: 2px; font-size: var(--fs-s); color: var(--muted); position: relative; }
  .tabbar button[aria-current='page'] { color: var(--text); }
  .tabbar .dot { position: absolute; top: 8px; left: calc(50% + 8px); }
  .detail { inset: auto 0 0 0; top: 48px; width: auto; border-radius: var(--r-l) var(--r-l) 0 0; right: 0; }
  .figs { grid-template-columns: repeat(2, 1fr); }
  .fig:nth-child(3) { border-left: 0; }
  .fig:nth-child(n + 3) { border-top: var(--bw) solid var(--hairline); }
  .rows .k { width: 96px; }
  .tray-row { grid-template-columns: 32px 1fr auto; }
  .tray-row .progress, .tray-row .pw { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script>
const { IMAGES, TRASH, TOKENS, FOLDERS, SOURCES, FORMAT, icon, esc, size, ago, stamp, midName, folderLabel, folderPath, children, directCount, inFolder, justify, toast, params } = PB;
const S = {
  view: params.get('view') || 'library',
  state: params.get('state') || 'ready',
  folder: params.get('folder') || null,
  sel: params.get('detail') ? Number(params.get('detail')) : null,
  open: new Set(['travel', 'y2026']),
};
const phone = () => innerWidth <= 720;

function tree(pid, depth) {
  return children(pid).map((f) => {
    const kids = children(f.id).length;
    const open = S.open.has(f.id);
    return `<button class="nav sub${depth}" data-folder="${f.id}" ${S.view === 'library' && S.folder === f.id ? 'aria-current="page"' : ''}>
      <span class="tw" data-toggle="${kids ? f.id : ''}">${kids ? icon(open ? 'down' : 'right', 'icon-s') : ''}</span>
      ${icon('folder')}<span class="label ellipsis">${esc(f.name)}</span><span class="n">${directCount(f.id) || ''}</span></button>
      ${kids && open ? tree(f.id, depth + 1) : ''}`;
  }).join('');
}

function side() {
  return `<nav class="side" aria-label="导航">
    <div class="brand"><span class="mark"></span><span class="label">PicBerth</span></div>
    <button class="search-trigger">${icon('search')}<span>搜索</span><kbd>Ctrl K</kbd></button>
    <button class="nav" data-folder="" ${S.view === 'library' && !S.folder ? 'aria-current="page"' : ''} title="图片">${icon('image')}<span class="label">图片</span><span class="n">${inFolder(null).length}</span></button>
    ${tree(null, 1)}
    <hr />
    <button class="nav" data-view="trash" ${S.view === 'trash' ? 'aria-current="page"' : ''} title="回收站">${icon('trash')}<span class="label">回收站</span><span class="n">${TRASH.length}</span></button>
    <div class="gap"></div>
    <button class="nav" data-view="system" ${S.view === 'system' ? 'aria-current="page"' : ''} title="系统">${icon('gear')}<span class="label">系统</span></button>
    <button class="nav" title="admin"><span class="avatar">A</span><span class="label">admin</span></button>
  </nav>`;
}

function crumbs() {
  if (S.view === 'trash') return `<h1 class="crumbs">回收站<span class="count">${TRASH.length}</span></h1>`;
  if (S.view === 'system') return `<h1 class="crumbs">系统</h1>`;
  const path = S.folder ? folderPath(S.folder) : [];
  const count = S.folder ? inFolder(S.folder).length : IMAGES.filter((i) => !i.folderId).length;
  if (phone()) {
    const cur = path.length ? path[path.length - 1].name : '图片';
    return `<h1 class="crumbs"><span class="ellipsis">${esc(cur)}</span>${icon('down', 'icon-s')}<span class="count">${count}</span></h1>`;
  }
  const parts = [`<button class="${path.length ? 'up' : ''}" data-folder="">图片</button>`].concat(path.map((f, i) => `<span class="sepi">/</span><button class="${i < path.length - 1 ? 'up' : ''}" data-folder="${f.id}">${esc(f.name)}</button>`));
  return `<h1 class="crumbs">${parts.join('')}<span class="count">${count}</span></h1>`;
}

function headControls() {
  if (S.view === 'system') return `<div class="grow"></div>`;
  if (S.view === 'trash') return `<div class="grow"></div><button class="btn btn-secondary">清空回收站</button>`;
  return `<div class="grow"></div>
    <label class="field-wrap search">${icon('search')}<input class="input" placeholder="搜索" aria-label="搜索" /><kbd>/</kbd></label>
    <button class="btn btn-ghost d-only">${icon('filter')}筛选</button>
    <button class="btn btn-ghost btn-icon d-only" aria-label="排序">${icon('sort')}</button>
    <div class="seg seg-icons d-only"><button aria-pressed="true" aria-label="网格">${icon('grid')}</button><button aria-label="列表">${icon('list')}</button></div>
    <button class="btn btn-ghost btn-icon m-only" aria-label="搜索">${icon('search')}</button>
    <button class="btn btn-ghost btn-icon m-only" aria-label="显示">${icon('more')}</button>
    <button class="btn btn-primary" data-act="upload">${icon('upload')}<span class="d-only">上传</span></button>`;
}

function tray() {
  const items = [
    { img: IMAGES[11], p: 100, st: 'done' },
    { img: IMAGES[13], p: 100, st: 'done' },
    { img: IMAGES[8], p: 64, st: 'up' },
    { img: IMAGES[2], p: 0, st: 'err' },
  ];
  return `<section class="tray" aria-label="上传">
    <div class="tray-head"><span class="medium">上传</span><span class="muted tabular">2 / 4</span><div class="grow"></div>
      <button class="btn btn-ghost btn-sm" data-copy="all">${icon('copy')}复制全部链接</button>
      <button class="btn btn-ghost btn-icon btn-sm" aria-label="关闭">${icon('x')}</button></div>
    ${items.map((it) => `<div class="tray-row"><img src="${it.img.src}" alt="" />
      <span class="ellipsis">${esc(it.img.name)}</span>
      ${it.st === 'up' ? `<div class="progress pw"><i style="width:${it.p}%"></i></div>` : it.st === 'err' ? `<span class="st text-danger pw">文件超过 20 MB</span>` : `<span class="st pw">${size(it.img.size)}</span>`}
      ${it.st === 'done' ? `<button class="btn btn-ghost btn-sm" data-copy="1">${icon('copy')}复制链接</button>` : it.st === 'up' ? `<span class="st tabular">${it.p}%</span>` : `<button class="btn btn-ghost btn-sm">重试</button>`}
    </div>`).join('')}
  </section>`;
}

function grid(list, width) {
  const gap = phone() ? 8 : 12;
  const rows = justify(list, width, phone() ? 120 : 176, gap);
  return rows.map((r) => `<div class="jrow">${r.items.map((im) => {
    const w = Math.floor((im.w / im.h) * r.h);
    const idx = IMAGES.indexOf(im);
    const max = w;
    return `<div class="tile" style="width:${w}px" aria-selected="${S.sel === idx}">
      <button class="tile-img" style="height:${Math.round(r.h)}px" ${idx >= 0 ? `data-open="${idx}"` : ''} aria-label="${esc(im.name)}"><img src="${im.src}" alt="" loading="lazy" /></button>
      <div class="over"><button class="chk" aria-label="选择"><span class="box"></span></button><button class="cp" data-copy="1" aria-label="复制链接">${icon('copy')}</button></div>
      ${im.frames > 1 ? '<span class="badge-gif">GIF</span>' : ''}
      <span class="name" title="${esc(im.name)}">${esc(midName(im.name, max))}</span>
      ${im.trashedDays != null ? `<span class="s muted tabular">${30 - im.trashedDays} 天后清除</span>` : ''}
    </div>`;
  }).join('')}</div>`).join('');
}

function library() {
  if (S.state === 'loading') {
    return `<div class="chips">${[1, 2, 3].map(() => '<span class="skeleton" style="width:96px;height:32px"></span>').join('')}</div>
      ${[0, 1].map(() => `<div class="jrow">${[220, 160, 260, 200].map((w) => `<span class="skeleton" style="width:${w}px;height:176px"></span>`).join('')}</div>`).join('')}`;
  }
  if (S.state === 'empty') {
    return `<div class="empty" style="height:100%">${icon('image')}<span class="t">还没有图片</span><button class="btn btn-primary">${icon('upload')}上传</button></div>`;
  }
  const subs = children(S.folder);
  return `${S.state === 'uploading' ? tray() : ''}
    ${subs.length ? `<div class="chips">${subs.map((f) => `<button class="fchip" data-folder="${f.id}">${icon('folder')}<span>${esc(f.name)}</span><span class="n">${directCount(f.id) || ''}</span></button>`).join('')}</div>` : ''}
    <div id="grid"></div>`;
}

function trash() {
  return `<div id="grid"></div>`;
}

function detail() {
  if (S.sel == null) return '';
  const im = IMAGES[S.sel];
  return `<aside class="detail" aria-label="图片详情">
    <div class="d-top"><button class="btn btn-ghost btn-icon" aria-label="上一张" data-step="-1">${icon('left')}</button><button class="btn btn-ghost btn-icon" aria-label="下一张" data-step="1">${icon('right')}</button>
      <span class="muted tabular s">${S.sel + 1} / ${IMAGES.length}</span><div class="grow"></div><button class="btn btn-ghost btn-icon" aria-label="关闭" data-close>${icon('x')}</button></div>
    <div class="d-body">
      <div class="d-prev"><img src="${im.src}" alt="" /></div>
      <div><div class="d-title">${esc(im.name)}</div>
        <div class="meta tabular"><span>${im.w} × ${im.h}</span><span>${size(im.size)}</span><span>${FORMAT[im.fmt]}</span></div></div>
      <div class="links">${[['URL', 'url'], ['Markdown', 'markdown'], ['HTML', 'html'], ['BBCode', 'bbcode']].map(([k, f]) => `<div class="links-row"><span class="k">${k}</span><span class="v">${esc(im.links[f])}</span><button class="btn btn-ghost btn-icon btn-sm" data-copy="1" aria-label="复制 ${k}">${icon('copy')}</button></div>`).join('')}</div>
      <dl class="props">
        <dt>文件夹</dt><dd>${esc(folderLabel(im.folderId))}</dd>
        <dt>来源</dt><dd>${esc(SOURCES[im.source])}</dd>
        <dt>上传时间</dt><dd class="tabular">${stamp(im.createdAt)}</dd>
        <dt>ID</dt><dd class="mono">${im.id}</dd>
        <dt>SHA-256</dt><dd class="mono">${im.sha}</dd>
      </dl>
    </div>
    <div class="d-foot"><button class="btn btn-ghost">${icon('download')}下载</button><button class="btn btn-ghost btn-danger-text">${icon('trash')}移到回收站</button></div>
  </aside>`;
}

function system() {
  return `<div class="sys">
    <section id="status">
      <h2 class="sec-title">状态</h2>
      <div class="health"><span class="dot dot-warning"></span><span class="grow">近期没有快照</span><button class="btn btn-secondary btn-sm">创建快照</button></div>
      <div class="figs">
        <div class="fig"><b>${IMAGES.length}</b><span>图片</span></div>
        <div class="fig"><b>${size(IMAGES.reduce((a, i) => a + i.size, 0))}</b><span>占用空间</span></div>
        <div class="fig"><b>${TRASH.length}</b><span>回收站</span></div>
        <div class="fig"><b>0</b><span>损坏</span></div>
      </div>
      <div class="disk">${(() => { const img = IMAGES.reduce((a, i) => a + i.size, 0), db = 4 * 1024 * 1024; return `<div class="bar" aria-hidden="true"><i style="width:${(img / (img + db)) * 100}%"></i><i style="width:${(db / (img + db)) * 100}%"></i></div>
        <div class="legend"><span>图片<b>${size(img)}</b></span><span>数据库<b>${size(db)}</b></span><span>磁盘可用<b>690.9 GB</b></span></div>`; })()}</div>
      <div class="rows" style="margin-top:16px">
        <div><span class="k">快速检查</span><span class="muted"><span class="dot dot-success" style="display:inline-block;margin-right:8px"></span>正常 3 分钟前</span><button class="btn btn-ghost btn-sm">检查</button></div>
        <div><span class="k">完整检查</span><span class="muted">从未运行</span><button class="btn btn-ghost btn-sm">检查</button></div>
        <div><span class="k">操作记录</span><span class="muted">保留 180 天</span><button class="btn btn-ghost btn-sm">查看${icon('right', 'icon-s')}</button></div>
      </div>
    </section>
    <section id="tokens">
      <h2 class="sec-title"><span class="grow">令牌</span><button class="btn btn-ghost btn-sm">API 文档</button><button class="btn btn-secondary btn-sm">${icon('plus')}新建令牌</button></h2>
      <div class="rows">${TOKENS.map((t) => `<div><span class="tok-name"><span class="medium ellipsis">${esc(t.name)}</span><span class="mono muted">${t.prefix}…</span></span>
        <span class="muted d-only" style="flex:none;width:96px">${t.scopes.join('、')}</span><span class="muted d-only" style="flex:none;width:96px">${t.last ? ago(t.last) : '从未使用'}</span><button class="btn btn-ghost btn-sm">吊销</button></div>`).join('')}</div>
    </section>
    <section id="settings">
      <h2 class="sec-title">设置</h2>
      <div class="rows">
        <div><span class="k">单文件上限</span><label class="field-wrap has-suffix unit"><input class="input tabular" value="20" aria-label="单文件上限" /><span class="suffix">MB</span></label></div>
        <div><span class="k">格式</span><span class="row" style="flex-wrap:wrap">${['JPEG', 'PNG', 'GIF', 'WebP', 'AVIF'].map((f) => `<button class="chip" aria-pressed="true">${f}</button>`).join('')}</span></div>
        <div><span class="k">重复检测</span><button class="switch" role="switch" aria-checked="true" aria-label="重复检测"></button></div>
        <div><span class="k">回收站保留</span><label class="field-wrap has-suffix unit"><input class="input tabular" value="30" aria-label="回收站保留" /><span class="suffix">天</span></label></div>
        <div><span class="k">操作记录保留</span><label class="field-wrap has-suffix unit"><input class="input tabular" value="180" aria-label="操作记录保留" /><span class="suffix">天</span></label></div>
        <div><span class="k">图片地址</span><span class="mono muted ellipsis">https://img.example.com</span><button class="btn btn-ghost btn-icon btn-sm" data-copy="1" aria-label="复制图片地址">${icon('copy')}</button></div>
      </div>
    </section>
  </div>`;
}

function tabbar() {
  return `<nav class="tabbar" aria-label="导航">
    <button data-view="library" ${S.view === 'library' ? 'aria-current="page"' : ''}>${icon('image')}图片</button>
    <button data-view="trash" ${S.view === 'trash' ? 'aria-current="page"' : ''}>${icon('trash')}回收站</button>
    <button data-view="system" ${S.view === 'system' ? 'aria-current="page"' : ''}>${icon('gear')}系统</button>
  </nav>`;
}

function render() {
  const body = S.view === 'system' ? system() : S.view === 'trash' ? trash() : library();
  document.getElementById('app').innerHTML = `${side()}
    <div class="panel"><main class="main"><header class="head">${crumbs()}${headControls()}</header><div class="content" id="content">${body}</div></main>${S.view === 'library' ? detail() : ''}</div>${tabbar()}`;
  const g = document.getElementById('grid');
  if (g) {
    const w = g.clientWidth;
    if (S.view === 'trash') {
      g.innerHTML = grid(TRASH, w);
    } else {
      const list = inFolder(S.folder);
      g.innerHTML = list.length ? grid(list, w) : `<div class="empty">${icon('folder')}<span class="t">这里没有图片</span></div>`;
    }
  }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-open]');
  if (!t) return;
  if (t.dataset.toggle) { e.stopPropagation(); const id = t.dataset.toggle; S.open.has(id) ? S.open.delete(id) : S.open.add(id); return render(); }
  if (t.dataset.copy) { e.stopPropagation(); return toast(t.dataset.copy === 'all' ? '已复制 2 条链接' : '已复制链接'); }
  if (t.dataset.open != null) { S.sel = Number(t.dataset.open); return render(); }
  if (t.hasAttribute('data-close')) { S.sel = null; return render(); }
  if (t.dataset.step) { S.sel = (S.sel + Number(t.dataset.step) + IMAGES.length) % IMAGES.length; return render(); }
  if (t.dataset.folder != null) { S.view = 'library'; S.folder = t.dataset.folder || null; S.sel = null; return render(); }
  if (t.dataset.view) { S.view = t.dataset.view; S.sel = null; if (S.view === 'library') S.folder = null; return render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sel != null) { S.sel = null; render(); } });
addEventListener('resize', render);
render();
</script>
</body>
</html>
