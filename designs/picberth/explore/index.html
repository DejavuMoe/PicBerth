<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PicBerth 重新设计方向</title>
<link rel="stylesheet" href="base.css" />
<style>
/* Review board only. Not part of the product. */
body { background: var(--bg); padding: 16px 20px 40px; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.bar h1 { font-size: var(--fs-l); font-weight: var(--w-strong); margin-right: 8px; }
.states { display: flex; gap: 4px; flex-wrap: wrap; }
.stage { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.frame { display: grid; gap: 8px; }
.frame .cap { color: var(--muted); font-size: var(--fs-s); display: flex; gap: 12px; }
.box { overflow: hidden; border-radius: var(--r-l); box-shadow: 0 0 0 var(--bw) var(--hairline), var(--shadow); background: var(--panel); }
.box iframe { border: 0; transform-origin: 0 0; display: block; }
a.open { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>
<div class="bar">
  <h1>重新设计方向</h1>
  <div class="seg" id="dirs" role="group" aria-label="方向">
    <button data-d="a" aria-pressed="true">A 精修控制台</button>
    <button data-d="b">B 上传优先</button>
    <button data-d="c">C 三栏文件管理</button>
  </div>
  <div class="seg" id="theme" role="group" aria-label="主题">
    <button data-t="dark" aria-pressed="true">深色</button>
    <button data-t="light">浅色</button>
  </div>
  <div class="states" id="states"></div>
</div>
<div class="stage" id="stage"></div>
<script>
const STATES = {
  a: [['ready', '默认'], ['uploading', '上传中'], ['detail', '详情'], ['empty', '空'], ['loading', '加载中'], ['system', '系统'], ['trash', '回收站']],
  b: [['ready', '默认'], ['uploading', '上传中'], ['empty', '空'], ['library', '图片'], ['trash', '回收站']],
  c: [['ready', '默认'], ['one', '单选'], ['multi', '多选'], ['folder', '文件夹'], ['phone-folders', '手机：文件夹'], ['phone-detail', '手机：详情']],
};
const q = new URLSearchParams(location.search);
// Only known values from the address reach the page.
const pick = (v, allowed, fallback) => allowed.find((x) => x === v) ?? fallback;
let d = pick(q.get('d'), ['a', 'b', 'c'], 'a');
let t = pick(q.get('theme'), ['dark', 'light'], 'dark');
let st = pick(q.get('s'), STATES[d].map(([k]) => k), 'ready');

function qs(dir, s) {
  const m = {
    a: { detail: 'detail=2', system: 'view=system', trash: 'view=trash' },
    b: { library: 'tab=library', trash: 'tab=trash' },
    c: { folder: 'folder=shots', 'phone-folders': 'm=folders', 'phone-detail': 'detail=2' },
  }[dir][s];
  return m || (s === 'ready' ? '' : `state=${s}`);
}
function frame(src, w, h, scale, cap) {
  return `<div class="frame"><div class="cap"><span>${cap}</span><a class="open" href="${src}" target="_blank" rel="noopener">${w} × ${h}</a></div>
    <div class="box" style="width:${w * scale}px;height:${h * scale}px"><iframe title="${cap}" src="${src}" width="${w}" height="${h}" style="transform:scale(${scale})"></iframe></div></div>`;
}
function render() {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('#dirs button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.d === d));
  document.querySelectorAll('#theme button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.t === t));
  document.getElementById('states').innerHTML = STATES[d].map(([k, l]) => `<button class="chip" aria-pressed="${k === st}" data-s="${k}">${l}</button>`).join('');
  const extra = qs(d, st);
  const src = `${d}.html?theme=${t}${extra ? '&' + extra : ''}`;
  const avail = Math.max(600, innerWidth - 40 - 20 - 390 * 0.8);
  const scale = Math.min(0.78, avail / 1440);
  document.getElementById('stage').innerHTML = frame(src, 1440, 900, scale, '桌面') + frame(src, 390, 844, 0.8, '手机') + frame(src, 1024, 768, 0.5, '平板');
  history.replaceState(null, '', `?d=${d}&theme=${t}&s=${st}`);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d) { d = b.dataset.d; st = 'ready'; }
  if (b.dataset.t) t = b.dataset.t;
  if (b.dataset.s) st = b.dataset.s;
  render();
});
addEventListener('resize', render);
render();
</script>
</body>
</html>
