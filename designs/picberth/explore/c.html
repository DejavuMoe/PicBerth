<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>PicBerth</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="shared.css" />
<style>
/* Direction C: three columns, dense table, inspector always visible; drill-down on phones. */
.app { flex-direction: column; background: var(--bg); }
.tool { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 12px; border-bottom: var(--bw) solid var(--hairline); }
.mark { width: 16px; height: 16px; border-radius: var(--r-xs); background: var(--accent); margin: 0 12px 0 4px; flex: none; }
.path { display: flex; align-items: center; gap: 2px; min-width: 0; margin-left: 8px; }
.path button { height: 28px; padding: 0 6px; border-radius: var(--r-xs); display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.path button:hover { background: var(--hover); color: var(--text); }
.path button:last-child { color: var(--text); font-weight: var(--w-medium); }
.path .sepi { color: var(--faint); }
.tool .search { width: 240px; }

.cols { flex: 1; min-height: 0; display: flex; }
.tree { width: 232px; flex: none; display: flex; flex-direction: column; padding: 8px; gap: 1px; overflow: auto; }
.node { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: var(--r-xs); color: var(--muted); text-align: left; width: 100%; }
.node:hover { background: var(--hover); color: var(--text); }
.node[aria-current='true'] { background: var(--sel); color: var(--text); }
.node .n { margin-left: auto; font-size: var(--fs-s); }
.node .tw { width: 14px; display: grid; place-items: center; color: var(--faint); flex: none; }
.tree .gap { flex: 1; }
.tree hr { border: 0; border-top: var(--bw) solid var(--hairline); margin: 8px; }

.mid { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-left: var(--bw) solid var(--hairline); border-right: var(--bw) solid var(--hairline); }
.table { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { position: sticky; top: 0; background: var(--panel); height: 32px; text-align: left; font-weight: var(--w-medium); color: var(--muted); font-size: var(--fs-s); border-bottom: var(--bw) solid var(--hairline); padding: 0 8px; white-space: nowrap; z-index: 1; }
th button { display: inline-flex; align-items: center; gap: 4px; }
th button:hover { color: var(--text); }
td { height: 32px; padding: 0 8px; border-bottom: var(--bw) solid var(--hairline); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tr.r:hover td { background: var(--hover); }
tr.r[aria-selected='true'] td { background: var(--sel); }
td.c, th.c { width: 40px; padding: 0 0 0 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
td .nm img { width: 20px; height: 20px; border-radius: var(--r-xs); object-fit: cover; flex: none; }
td .nm .icon { color: var(--muted); }
td .nm span { overflow: hidden; text-overflow: ellipsis; }
td.m { color: var(--muted); }
.status { height: 28px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 12px; border-top: var(--bw) solid var(--hairline); color: var(--muted); font-size: var(--fs-s); }
.status b { color: var(--text); font-weight: var(--w-medium); }

.insp { width: 320px; flex: none; overflow: auto; padding: 16px 20px; display: grid; gap: 16px; align-content: start; }
.insp .prev { aspect-ratio: 4 / 3; border-radius: var(--r-m); overflow: hidden; background: var(--fill); }
.insp .prev img { width: 100%; height: 100%; object-fit: contain; }
.insp .title { font-size: var(--fs-l); line-height: var(--lh-l); font-weight: var(--w-strong); word-break: break-all; }
.insp .meta { display: flex; gap: 12px; color: var(--muted); }
.stack { position: relative; height: 180px; }
.stack img { position: absolute; width: 62%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--r-m); box-shadow: 0 0 0 var(--bw) var(--hairline); left: 50%; top: 50%; }
.acts { display: grid; gap: 2px; }
.acts .btn { justify-content: flex-start; margin: 0 -12px; padding: 0 12px; }
.acts .btn > .icon:first-child { margin-left: 0; }
.big { font-size: var(--fs-l); line-height: var(--lh-l); font-weight: var(--w-strong); }

.mhead, .mlist { display: none; }

@media (max-width: 1279px) { .insp { width: 280px; } col.src, th.src, td.src, col.fmt, th.fmt, td.fmt { display: none; } }
@media (max-width: 1023px) { .tree { display: none; } .mid { border-left: 0; } }
@media (max-width: 720px) {
  .tool, .cols { display: none; }
  .app { background: var(--panel); }
  .mhead { display: flex; align-items: center; gap: 4px; height: 48px; flex: none; padding: 0 8px; border-bottom: var(--bw) solid var(--hairline); }
  .mhead .t { flex: 1; text-align: center; font-weight: var(--w-strong); font-size: var(--fs-l); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mhead .back { display: inline-flex; align-items: center; gap: 2px; color: var(--muted); height: 36px; padding: 0 8px 0 4px; min-width: 72px; }
  .mhead .sidebtn { min-width: 72px; display: flex; justify-content: flex-end; gap: 2px; }
  .mlist { display: block; flex: 1; overflow: auto; padding-bottom: 24px; }
  .mrow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-bottom: var(--bw) solid var(--hairline); width: 100%; text-align: left; }
  .mrow img { width: 40px; height: 40px; border-radius: var(--r-s); object-fit: cover; flex: none; }
  .mrow .fi { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .mrow .nm { flex: 1; min-width: 0; display: grid; }
  .mrow .nm b { font-weight: var(--w-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .nm span { color: var(--muted); font-size: var(--fs-s); display: flex; gap: 12px; }
  .mrow > .icon { color: var(--faint); }
  .mdetail { padding: 16px; display: grid; gap: 16px; }
  .mdetail .prev { border-radius: var(--r-m); overflow: hidden; background: var(--fill); aspect-ratio: 4 / 3; }
  .mdetail .prev img { width: 100%; height: 100%; object-fit: contain; }
  .mfoot { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: var(--bw) solid var(--hairline); }
  .mfoot .btn { flex: 1; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script>
const { IMAGES, TRASH, FOLDERS, SOURCES, FORMAT, icon, esc, size, ago, stamp, folderLabel, folderPath, children, directCount, inFolder, toast, params } = PB;
const S = {
  folder: params.get('folder') || null,
  sel: new Set((params.get('sel') || '').split(',').filter(Boolean).map(Number)),
  open: new Set(['travel', 'y2026', 'docs']),
  m: params.get('m') || 'list',
  mdetail: params.get('detail') != null ? Number(params.get('detail')) : null,
  state: params.get('state') || 'ready',
};
if (S.state === 'one') S.sel = new Set([1]);
if (S.state === 'multi') S.sel = new Set(PB.inFolder(S.folder).slice(0, 5).filter((_, k) => k !== 1).slice(0, 3).map((im) => PB.IMAGES.indexOf(im)));
const list = () => inFolder(S.folder);
const idxOf = (im) => IMAGES.indexOf(im);

function tree(pid, depth) {
  return children(pid).map((f) => {
    const kids = children(f.id).length, open = S.open.has(f.id);
    return `<button class="node" style="padding-left:${8 + depth * 14}px" data-folder="${f.id}" aria-current="${S.folder === f.id}">
      <span class="tw" data-toggle="${kids ? f.id : ''}">${kids ? icon(open ? 'down' : 'right', 'icon-s') : ''}</span>${icon('folder')}<span class="ellipsis">${esc(f.name)}</span><span class="n">${directCount(f.id) || ''}</span></button>
      ${kids && open ? tree(f.id, depth + 1) : ''}`;
  }).join('');
}

function toolbar() {
  const path = S.folder ? folderPath(S.folder) : [];
  return `<header class="tool"><span class="mark" aria-hidden="true"></span>
    <button class="btn btn-ghost btn-icon btn-sm" aria-label="后退">${icon('left')}</button><button class="btn btn-ghost btn-icon btn-sm" aria-label="前进" disabled>${icon('right')}</button>
    <nav class="path" aria-label="位置"><button data-folder="">${icon('image')}图片</button>${path.map((f) => `<span class="sepi">${icon('right', 'icon-s')}</span><button data-folder="${f.id}">${esc(f.name)}</button>`).join('')}</nav>
    <div class="grow"></div>
    <label class="field-wrap search">${icon('search')}<input class="input" placeholder="搜索" aria-label="搜索" /><kbd>Ctrl K</kbd></label>
    <button class="btn btn-ghost">${icon('filter')}筛选</button>
    <div class="seg seg-icons"><button aria-label="网格">${icon('grid')}</button><button aria-pressed="true" aria-label="列表">${icon('list')}</button></div>
    <button class="btn btn-primary" style="margin-left:4px">${icon('upload')}上传</button>
  </header>`;
}

function table() {
  const subs = children(S.folder);
  const imgs = list();
  const all = imgs.length && imgs.every((im) => S.sel.has(idxOf(im)));
  return `<div class="table"><table>
    <colgroup><col style="width:40px" /><col /><col style="width:110px" /><col style="width:80px" /><col class="fmt" style="width:64px" /><col class="src" style="width:120px" /><col style="width:96px" /></colgroup>
    <thead><tr><th class="c"><button class="check" data-on="${all ? 'true' : S.sel.size ? 'mixed' : 'false'}" data-all aria-label="全选">${S.sel.size ? icon(all ? 'check' : 'x') : ''}</button></th>
      <th><button>名称</button></th><th class="num">尺寸</th><th class="num"><button>大小</button></th><th class="fmt">格式</th><th class="src">来源</th><th><button>上传时间 ${icon('down', 'icon-s')}</button></th></tr></thead>
    <tbody>
      ${subs.map((f) => `<tr class="r" data-folder="${f.id}"><td class="c"></td><td><span class="nm">${icon('folder')}<span>${esc(f.name)}</span></span></td><td class="num m"></td><td class="num m">${directCount(f.id) ? directCount(f.id) + ' 张' : ''}</td><td class="fmt m"></td><td class="src m"></td><td class="m"></td></tr>`).join('')}
      ${imgs.map((im) => { const i = idxOf(im), on = S.sel.has(i); return `<tr class="r" data-row="${i}" aria-selected="${on}">
        <td class="c"><span class="check" data-on="${on}" data-tick="${i}">${on ? icon('check') : ''}</span></td>
        <td><span class="nm"><img src="${im.src}" alt="" loading="lazy" /><span title="${esc(im.name)}">${esc(im.name)}</span></span></td>
        <td class="num m">${im.w} × ${im.h}</td><td class="num m">${size(im.size)}</td><td class="fmt m">${FORMAT[im.fmt]}</td><td class="src m">${esc(SOURCES[im.source])}</td><td class="m">${ago(im.createdAt)}</td></tr>`; }).join('')}
    </tbody></table>
    ${!imgs.length && !subs.length ? `<div class="empty">${icon('folder')}<span class="t">这里没有图片</span></div>` : ''}
  </div>`;
}

function inspector() {
  const sel = [...S.sel];
  if (sel.length === 1) {
    const im = IMAGES[sel[0]];
    return `<aside class="insp" aria-label="图片详情">
      <div class="prev"><img src="${im.src}" alt="" /></div>
      <div><div class="title">${esc(im.name)}</div><div class="meta tabular"><span>${im.w} × ${im.h}</span><span>${size(im.size)}</span><span>${FORMAT[im.fmt]}</span></div></div>
      <div class="links">${[['URL', 'url'], ['Markdown', 'markdown'], ['HTML', 'html'], ['BBCode', 'bbcode']].map(([k, f]) => `<div class="links-row"><span class="k">${k}</span><span class="v">${esc(im.links[f])}</span><button class="btn btn-ghost btn-icon btn-sm" data-copy="${k}" aria-label="复制 ${k}">${icon('copy')}</button></div>`).join('')}</div>
      <dl class="props"><dt>文件夹</dt><dd>${esc(folderLabel(im.folderId))}</dd><dt>来源</dt><dd>${esc(SOURCES[im.source])}</dd><dt>上传时间</dt><dd class="tabular">${stamp(im.createdAt)}</dd><dt>ID</dt><dd class="mono">${im.id}</dd><dt>SHA-256</dt><dd class="mono">${im.sha}</dd></dl>
      <div class="acts"><button class="btn btn-ghost">${icon('move')}移动到…</button><button class="btn btn-ghost">${icon('download')}下载</button><button class="btn btn-ghost btn-danger-text">${icon('trash')}移到回收站</button></div>
    </aside>`;
  }
  if (sel.length > 1) {
    const imgs = sel.map((i) => IMAGES[i]);
    return `<aside class="insp" aria-label="已选图片">
      <div class="stack">${imgs.slice(0, 3).map((im, k) => `<img src="${im.src}" alt="" style="transform:translate(-50%,-50%) rotate(${(k - 1) * 5}deg) translate(${(k - 1) * 14}px, 0)" />`).join('')}</div>
      <div><div class="big tabular">已选 ${sel.length} 张</div><div class="meta tabular"><span>${size(imgs.reduce((a, i) => a + i.size, 0))}</span></div></div>
      <div class="acts"><button class="btn btn-ghost" data-copy="links">${icon('copy')}复制链接</button><button class="btn btn-ghost">${icon('move')}移动到…</button><button class="btn btn-ghost">${icon('download')}下载</button><button class="btn btn-ghost btn-danger-text">${icon('trash')}移到回收站</button></div>
    </aside>`;
  }
  const subs = children(S.folder);
  const name = S.folder ? folderPath(S.folder).slice(-1)[0].name : '图片';
  return `<aside class="insp" aria-label="文件夹">
    <div><div class="big">${esc(name)}</div><div class="meta tabular"><span>${list().length} 张图片</span><span>${subs.length} 个文件夹</span></div></div>
    <div class="acts"><button class="btn btn-ghost">${icon('plus')}新建子文件夹</button>${S.folder ? `<button class="btn btn-ghost">重命名</button><button class="btn btn-ghost">${icon('move')}移动到…</button><button class="btn btn-ghost btn-danger-text" disabled>删除</button>` : ''}</div>
  </aside>`;
}

function desktop() {
  const imgs = list();
  const selImgs = [...S.sel].map((i) => IMAGES[i]);
  return `${toolbar()}<div class="cols">
    <nav class="tree" aria-label="文件夹">
      <button class="node" data-folder="" aria-current="${!S.folder}"><span class="tw"></span>${icon('image')}<span>图片</span><span class="n">${inFolder(null).length}</span></button>
      ${tree(null, 1)}
      <hr /><button class="node"><span class="tw"></span>${icon('trash')}<span>回收站</span><span class="n">${TRASH.length}</span></button>
      <div class="gap"></div>
      <button class="node"><span class="tw"></span>${icon('gear')}<span>管理</span><span class="dot dot-warning" style="margin-left:auto"></span></button>
      <button class="node"><span class="tw"></span><span class="avatar" style="width:16px;height:16px;border-radius:999px;background:var(--fill);display:grid;place-items:center;font-size:10px">A</span><span>admin</span></button>
    </nav>
    <main class="mid">${table()}
      <footer class="status tabular"><span><b>${imgs.length}</b> 张图片</span>${S.sel.size ? `<span>已选 <b>${S.sel.size}</b> 张</span><span>${size(selImgs.reduce((a, i) => a + i.size, 0))}</span>` : `<span>${size(imgs.reduce((a, i) => a + i.size, 0))}</span>`}</footer>
    </main>
    ${inspector()}
  </div>`;
}

function phoneView() {
  if (S.mdetail != null) {
    const im = IMAGES[S.mdetail];
    return `<header class="mhead"><button class="back" data-mback>${icon('left')}${esc(folderLabel(im.folderId).split(' / ').pop())}</button><span class="t"></span><span class="sidebtn"><button class="btn btn-ghost btn-icon" aria-label="更多">${icon('more')}</button></span></header>
      <div class="mlist"><div class="mdetail"><div class="prev"><img src="${im.src}" alt="" /></div>
        <div><div class="big" style="word-break:break-all">${esc(im.name)}</div><div class="row muted tabular" style="gap:12px"><span>${im.w} × ${im.h}</span><span>${size(im.size)}</span><span>${FORMAT[im.fmt]}</span></div></div>
        <div class="links">${[['URL', 'url'], ['Markdown', 'markdown'], ['HTML', 'html'], ['BBCode', 'bbcode']].map(([k, f]) => `<div class="links-row"><span class="k">${k}</span><span class="v">${esc(im.links[f])}</span><button class="btn btn-ghost btn-icon btn-sm" data-copy="${k}" aria-label="复制 ${k}">${icon('copy')}</button></div>`).join('')}</div>
        <dl class="props"><dt>文件夹</dt><dd>${esc(folderLabel(im.folderId))}</dd><dt>来源</dt><dd>${esc(SOURCES[im.source])}</dd><dt>上传时间</dt><dd class="tabular">${stamp(im.createdAt)}</dd></dl>
      </div></div>
      <div class="mfoot"><button class="btn btn-secondary">${icon('move')}移动</button><button class="btn btn-secondary btn-danger-text">${icon('trash')}移到回收站</button></div>`;
  }
  if (S.m === 'folders') {
    return `<header class="mhead"><span class="back"></span><span class="t">PicBerth</span><span class="sidebtn"><button class="btn btn-ghost btn-icon" aria-label="admin">${icon('gear')}</button></span></header>
      <div class="mlist">
        <button class="mrow" data-mfolder=""><span class="fi">${icon('image')}</span><span class="nm"><b>图片</b></span><span class="muted tabular">${inFolder(null).length}</span>${icon('right')}</button>
        ${FOLDERS.filter((f) => !f.parentId).map((f) => `<button class="mrow" data-mfolder="${f.id}"><span class="fi">${icon('folder')}</span><span class="nm"><b>${esc(f.name)}</b></span><span class="muted tabular">${directCount(f.id) || ''}</span>${icon('right')}</button>`).join('')}
        <button class="mrow"><span class="fi">${icon('trash')}</span><span class="nm"><b>回收站</b></span><span class="muted tabular">${TRASH.length}</span>${icon('right')}</button>
        <button class="mrow"><span class="fi">${icon('gear')}</span><span class="nm"><b>管理</b></span><span class="dot dot-warning"></span>${icon('right')}</button>
      </div>`;
  }
  const path = S.folder ? folderPath(S.folder) : [];
  const parent = path.length > 1 ? path[path.length - 2].name : path.length ? '图片' : '';
  const title = path.length ? path[path.length - 1].name : '图片';
  return `<header class="mhead"><button class="back" data-mup>${icon('left')}${esc(parent || '文件夹')}</button><span class="t">${esc(title)}</span>
    <span class="sidebtn"><button class="btn btn-ghost btn-icon" aria-label="搜索">${icon('search')}</button><button class="btn btn-primary btn-icon" aria-label="上传">${icon('upload')}</button></span></header>
    <div class="mlist">
      ${children(S.folder).map((f) => `<button class="mrow" data-mfolder="${f.id}"><span class="fi">${icon('folder')}</span><span class="nm"><b>${esc(f.name)}</b></span><span class="muted tabular">${directCount(f.id) || ''}</span>${icon('right')}</button>`).join('')}
      ${list().map((im) => `<button class="mrow" data-mopen="${idxOf(im)}"><img src="${im.src}" alt="" loading="lazy" /><span class="nm"><b>${esc(im.name)}</b><span class="tabular"><span>${size(im.size)}</span><span>${ago(im.createdAt)}</span></span></span></button>`).join('')}
    </div>`;
}

function render() {
  document.getElementById('app').innerHTML = innerWidth <= 720 ? phoneView() : desktop();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, tr, [data-tick]');
  if (!t) return;
  if (t.dataset.toggle) { e.stopPropagation(); const id = t.dataset.toggle; S.open.has(id) ? S.open.delete(id) : S.open.add(id); return render(); }
  if (t.dataset.copy) { e.stopPropagation(); return toast(t.dataset.copy === 'links' ? `已复制 ${S.sel.size} 条链接` : `已复制 ${t.dataset.copy}`); }
  const tick = e.target.closest('[data-tick]');
  if (tick) { const i = Number(tick.dataset.tick); S.sel.has(i) ? S.sel.delete(i) : S.sel.add(i); return render(); }
  if (t.hasAttribute('data-all')) { const imgs = list().map(idxOf); const all = imgs.every((i) => S.sel.has(i)); S.sel = new Set(all ? [] : imgs); return render(); }
  if (t.dataset.row != null) {
    const i = Number(t.dataset.row);
    if (e.ctrlKey || e.metaKey) { S.sel.has(i) ? S.sel.delete(i) : S.sel.add(i); } else S.sel = new Set([i]);
    return render();
  }
  if (t.dataset.folder != null) { S.folder = t.dataset.folder || null; S.sel = new Set(); return render(); }
  if (t.dataset.mfolder != null) { S.folder = t.dataset.mfolder || null; S.m = 'list'; return render(); }
  if (t.dataset.mopen != null) { S.mdetail = Number(t.dataset.mopen); return render(); }
  if (t.hasAttribute('data-mback')) { S.mdetail = null; return render(); }
  if (t.hasAttribute('data-mup')) { const p = S.folder ? folderPath(S.folder) : []; if (p.length > 1) S.folder = p[p.length - 2].id; else if (p.length) S.folder = null; else S.m = 'folders'; return render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { S.sel = new Set(); render(); } });
addEventListener('resize', render);
render();
</script>
</body>
</html>
