# Server block snippet for nginx >= 1.25 (the `http2 on;` directive).
# Native install, nginx on the same host as PicBerth.
# In /etc/picberth/picberth.env set PICBERTH_TRUSTED_PROXIES=127.0.0.1.
# PicBerth resolves the client IP from X-Forwarded-For right-to-left, skipping trusted
# entries, so spoofed left-hand entries sent by clients are ignored.

server {
    listen 443 ssl;
    http2 on;
    server_name pics.example.com;

    # Placeholder paths: replace with your certificate and key.
    ssl_certificate     /etc/ssl/pics.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/pics.example.com/privkey.pem;

    # nginx's default is 1m, which rejects most photos with 413. Must exceed PicBerth's
    # hard upload limit of 100 MiB plus multipart overhead.
    client_max_body_size 110m;
    client_body_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # proxy_request_buffering on (the default) buffers the whole upload to nginx's
        # temp directory before forwarding it to PicBerth.
        proxy_pass http://127.0.0.1:12433;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name pics.example.com;
    return 301 https://$host$request_uri;
}
