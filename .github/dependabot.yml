version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # svelte-check currently needs a separate migration for TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /.agents/skills/baoyu-design/agents/gen-pptx
      - /.agents/skills/baoyu-design/agents/gen-video
    schedule:
      interval: weekly
    groups:
      design-tools:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
