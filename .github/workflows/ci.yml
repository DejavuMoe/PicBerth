name: CI

on:
  push:
    # Validate a commit before a direct fast-forward to protected master.
    branches: [master, 'maintenance/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CGO_ENABLED: "0"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      design: ${{ steps.filter.outputs.design }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for changed paths
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag || -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}"; then
            printf '%s\n' code=true design=true skills=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            BASE=$(git merge-base "$BASE" "$HEAD")
          fi
          git diff --name-only --no-renames -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-paths"
          code=false
          design=false
          skills=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .agents/skills/baoyu-design/agents/gen-pptx/*|.agents/skills/baoyu-design/agents/gen-video/*) design=true ;;
              .agents/skills/security-audit/*.cjs|.agents/skills/security-audit/*.json) skills=true ;;
              .github/workflows/ci.yml|.github/actions/setup/*) code=true; design=true; skills=true ;;
              docs/*|designs/*|.agents/*) ;;
              */*) code=true ;;
              *.md|LICENSE|LICENSE.*) ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          printf '%s\n' "code=$code" "design=$design" "skills=$skills" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate workflow syntax
        if: runner.arch == 'X64'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Check OCI attestation validation
        if: runner.arch == 'X64'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: mise run test
        if: runner.arch == 'X64'
      - name: Test the native ARM64 service
        if: runner.arch == 'ARM64'
        run: |
          mise run web:build
          go vet ./...
          go test ./...
      - name: Go vulnerability check
        if: runner.arch == 'X64'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Frontend dependency audit (including build tools)
        if: runner.arch == 'X64'
        working-directory: web
        run: pnpm audit --audit-level moderate
  design-tools:
    needs: changes
    if: needs.changes.outputs.design == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-only: 'true'
      - name: Check design export tools
        run: |
          for tool in gen-pptx gen-video; do
            (
              cd ".agents/skills/baoyu-design/agents/$tool"
              npm ci --ignore-scripts
              npm audit --audit-level moderate
              npm run typecheck
              npm run build
              npm test
            )
          done

  skill-tests:
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-only: 'true'
      - name: Test security audit validators
        run: node --test .agents/skills/security-audit/*.test.cjs

  cross-compile:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mise run web:build
      - name: Cross-compile smoke build
        run: |
          # Linux binaries are built and checked by both native image jobs.
          for target in windows/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o "dist/${target//\//-}/" ./cmd/picberth
          done

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check browser system dependencies and install missing packages
        working-directory: web
        run: pnpm exec playwright install-deps --dry-run chromium || pnpm exec playwright install-deps chromium
      - name: Read the locked Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-shell-${{ steps.playwright.outputs.version }}
      - name: Ensure Chromium headless shell is installed
        working-directory: web
        run: pnpm exec playwright install --only-shell chromium
      - run: mise run web:e2e -- --project "$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
          E2E_OUTPUT_DIR: ${{ runner.temp }}/picberth-e2e-artifacts
      - name: Upload failed test traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures-${{ matrix.project }}
          path: ${{ runner.temp }}/picberth-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-image
        with:
          arch: ${{ matrix.arch }}

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, test, cross-compile, e2e, docker, design-tools, skill-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require success for each selected check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            def check($selected; $jobs):
              if $selected == "true" then $jobs | all(.result == "success")
              elif $selected == "false" then $jobs | all(.result == "skipped")
              else false end;
            .changes.result == "success" and
            check(.changes.outputs.code; [.test, .["cross-compile"], .e2e, .docker]) and
            check(.changes.outputs.design; [.["design-tools"]]) and
            check(.changes.outputs.skills; [.["skill-tests"]])
          ' <<< "$RESULTS"
