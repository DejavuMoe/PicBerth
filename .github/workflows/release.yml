name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse without publishing (for example v0.0.1)
        required: true
        default: v0.0.1
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: windows
            goarch: amd64
            runner: ubuntu-24.04
          - goos: darwin
            goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go-cache-suffix: ${{ matrix.goos }}-${{ matrix.goarch }}
      - run: mise run web:build
      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag, got: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          test "$version" = "$(node -p 'require("./web/package.json").version')"
          binary=picberth
          if [[ "$GOOS" == windows ]]; then binary=picberth.exe; fi
          mkdir -p package release
          cp LICENSE package/
          go build -trimpath -ldflags "-s -w -X picberth/internal/buildinfo.Version=$TAG -X picberth/internal/buildinfo.Commit=$GITHUB_SHA" -o "package/$binary" ./cmd/picberth
          archive="picberth_${TAG}_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == windows ]]; then
            (cd package && zip "../release/$archive.zip" "$binary" LICENSE)
          else
            tar -czf "release/$archive.tar.gz" -C package "$binary" LICENSE
          fi
          (cd release && sha256sum "$archive".* > "$archive.sha256" && sha256sum --check "$archive.sha256")
      - name: Attest release archives
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  image:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/native-image
        with:
          arch: ${{ matrix.arch }}
          version: ${{ inputs.version || github.ref_name }}
          push: ${{ github.event_name == 'push' }}

  manifest:
    if: github.event_name == 'push'
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge native images and retain attestations
        env:
          TAGS: ghcr.io/dejavumoe/picberth:${{ github.ref_name }}
        shell: bash
        run: |
          regctl() {
            docker run --rm -i -v "$HOME/.docker/config.json:/home/appuser/.docker/config.json:ro" regclient/regctl:v0.8.3@sha256:d0cda0dabd3c328ff5649502b18913109ecbb4a169db6a91e7089f6f89cd958b "$@"
          }
          image=ghcr.io/dejavumoe/picberth
          source="$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          while IFS= read -r tag; do
            regctl manifest get "$source-amd64" --format raw-body > amd64.json
            regctl manifest get "$source-arm64" --format raw-body > arm64.json
            jq -s '.[0].manifests += .[1].manifests | .[0]' amd64.json arm64.json | regctl manifest put "$tag"
            regctl manifest get "$tag" --format raw-body | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          done <<< "$TAGS"

  release:
    if: github.event_name == 'push'
    needs: [binaries, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Checksums and GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
          flags=()
          if [[ "${TAG%%+*}" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" ./*.tar.gz ./*.zip SHA256SUMS --verify-tag --title "PicBerth $TAG" --notes-file "../docs/releases/$TAG.md" "${flags[@]}"
